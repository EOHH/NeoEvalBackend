# -------------------------------
# SERVER (Railway asigna el puerto, en local usa 8080 por defecto)
server.port=${PORT:8090}
server.address=0.0.0.0

# -------------------------------
# DATASOURCE (Variables de Railway, con valores por defecto para tu PC local)
# Cambia 'neoeval', 'root' y 'password' por las credenciales de tu MySQL local si las necesitas
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:neoevaldb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------
# JPA / Hibernate (Nuevos ajustes optimizados)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# OPTIMIZACIÓN DE CONEXIONES HIKARICP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# -------------------------------
spring.application.name=NeoEvalBackend

# UPLOADS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------
# ADMIN DEFAULTS
app.admin.default-email=${ADMIN_EMAIL:gottidev2004@gmail.com}
app.admin.default-password=${ADMIN_PASSWORD:Admin123!}

