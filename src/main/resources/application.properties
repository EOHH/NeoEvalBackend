# -------------------------------
# 🌐 Configuración de red del servidor
server.port=8090
server.address=0.0.0.0

# 📦 Base de datos MySQL
# CRUCIAL: serverTimezone=UTC en la URL es el 50% de la solución.
spring.datasource.url=jdbc:mysql://localhost:3306/neoevaldb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# **ESTA LÍNEA DEBE SEGUIR AHÍ (JVM en UTC)**

# -------------------------------
# ⚙️ JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ✅ LÍNEA CLAVE AÑADIDA: El 100% de la solución de Hibernate.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -------------------------------
# 🔧 Otras configuraciones
spring.application.name=NeoEvalBackend

# 📁 Subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB